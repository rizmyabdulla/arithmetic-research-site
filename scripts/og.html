<!doctype html>
<!--
  Social preview template (1200 × 630). public/og.png is a screenshot of this
  file. To regenerate: open it in a browser from the repo (fonts load from
  node_modules), set the viewport to 1200 × 630, and capture the page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'IT'; src: url('../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2'); font-weight: 100 900; }
      @font-face { font-family: 'IS'; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2'); font-style: italic; }
      @font-face { font-family: 'JM'; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2'); font-weight: 100 900; }
      html, body { margin: 0; width: 1200px; height: 630px; background: #0c0c0a; color: #ecebe5; overflow: hidden; }
      body { position: relative; font-family: 'IT', sans-serif; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(236 235 229 / .06) 1px, transparent 1px), linear-gradient(90deg, rgb(236 235 229 / .06) 1px, transparent 1px); background-size: 48px 48px; }
      .eq { position: absolute; right: 72px; top: 110px; width: 360px; height: 156px; }
      .eq span { position: absolute; height: 58px; background: #ecebe5; }
      .c { left: 0; top: 0; width: 58px; background: #ff4d1a !important; }
      .t { left: 96px; right: 0; top: 0; }
      .b { left: 0; right: 0; bottom: 0; }
      h1 { position: absolute; left: 64px; bottom: 120px; margin: 0; font-size: 132px; line-height: .82; letter-spacing: -.06em; font-weight: 650; }
      h1 em { font-family: 'IS', serif; font-weight: 400; letter-spacing: -.03em; font-size: 1.1em; }
      p { position: absolute; left: 64px; bottom: 52px; margin: 0; font-family: 'JM', monospace; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; color: #a19f96; }
      p b { color: #ff4d1a; font-weight: 400; }
      .tag { position: absolute; left: 64px; top: 56px; font-family: 'IS', serif; font-style: italic; font-size: 40px; color: #ff4d1a; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="tag">Intelligence, carefully computed.</div>
    <div class="eq"><span class="c"></span><span class="t"></span><span class="b"></span></div>
    <h1>Arithmetic<br /><em>Research</em></h1>
    <p><b>■</b>&nbsp; AI products · Agents · Automation &nbsp;—&nbsp; arithmeticresearch.com</p>
  </body>
</html>
